[project]
name = "binance-etl"
version = "0.1.0"
description = "Binance ETL Pipeline."
readme = "README.md"
authors = [
    { name = "njuedominic", email = "nmd.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[project.scripts]
binance-etl = "binance_etl:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
